#####
# Rules coming from https://camel.apache.org/manual/camel-4x-upgrade-guide-4_21.html
#####

#####
# Update the Camel project from 4.20 to 4.21
#####
---
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel421.CamelMigrationRecipe
displayName: Migrates `camel 4.20` application to `camel 4.21`
description: Migrates `camel 4.20` application to `camel 4.21`.
recipeList:
  # Recipes from 4.18.3 (changes first introduced in 4.18.x)
  - org.apache.camel.upgrade.camel418_3.upgradeKafkaRecipes
  - org.apache.camel.upgrade.camel418_3.upgradeJGroupsHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeDnsHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeJiraHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeJGroupsRaftHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeShiroHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeElasticsearchRestClientHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeSolrHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeGitHub2Headers
  - org.apache.camel.upgrade.camel418_3.upgradeGoogleCloudHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeMongoDbGridFsHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeLuceneHeaders
  - org.apache.camel.upgrade.camel418_3.upgradePdfHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeArangoDbHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeJt400Headers
  - org.apache.camel.upgrade.camel418_3.upgradeMailHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeMiloHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeElasticsearchHeaders
  - org.apache.camel.upgrade.camel418_3.upgradeOpensearchHeaders
  - org.apache.camel.upgrade.camel418_3.migrateGithubToGithub2
  # 4.21-only recipes
  - org.apache.camel.upgrade.camel421.upgradeCouchdbHeaders
  - org.apache.camel.upgrade.camel421.upgradeCouchbaseHeaders
  - org.apache.camel.upgrade.camel421.upgradeIrcHeaders
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_21.adoc#camel-couchdb
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel421.upgradeCouchdbHeaders
displayName: Migrate camel-couchdb header constants to new naming convention
description: Renames CouchDB header constants to CamelCouchDb* pattern only if camel-couchdb dependency is present.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-couchdb
recipeList:
  - org.apache.camel.upgrade.camel421.RenameHeaders:
      headerMappings:
        CouchDbDatabase: CamelCouchDbDatabase
        CouchDbSeq: CamelCouchDbSeq
        CouchDbId: CamelCouchDbId
        CouchDbRev: CamelCouchDbRev
        CouchDbMethod: CamelCouchDbMethod
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_21.adoc#camel-couchbase
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel421.upgradeCouchbaseHeaders
displayName: Migrate camel-couchbase header constants to new naming convention
description: Renames Couchbase header constants to CamelCouchbase* pattern only if camel-couchbase dependency is present.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-couchbase
recipeList:
  - org.apache.camel.upgrade.camel421.RenameHeaders:
      headerMappings:
        CCB_KEY: CamelCouchbaseKey
        CCB_ID: CamelCouchbaseId
        CCB_TTL: CamelCouchbaseTtl
        CCB_DDN: CamelCouchbaseDesignDocumentName
        CCB_VN: CamelCouchbaseViewName
---
## https://github.com/apache/camel/blob/main/docs/user-manual/modules/ROOT/pages/camel-4x-upgrade-guide-4_21.adoc#camel-irc-potential-breaking-change
type: specs.openrewrite.org/v1beta/recipe
name: org.apache.camel.upgrade.camel421.upgradeIrcHeaders
displayName: Migrate camel-irc header constants to new naming convention
description: Renames IRC header constants from irc.* to CamelIrc* pattern only if camel-irc dependency is present.
preconditions:
  - org.openrewrite.java.dependencies.search.ModuleHasDependency:
      groupIdPattern: org.apache.camel
      artifactIdPattern: camel-irc
recipeList:
  - org.apache.camel.upgrade.camel421.RenameHeaders:
      headerMappings:
        irc.messageType: CamelIrcMessageType
        irc.target: CamelIrcTarget
        irc.sendTo: CamelIrcSendTo
        irc.user.kicked: CamelIrcUserKicked
        irc.user.host: CamelIrcUserHost
        irc.user.nick: CamelIrcUserNick
        irc.user.servername: CamelIrcUserServername
        irc.user.username: CamelIrcUserUsername
        irc.num: CamelIrcNum
        irc.value: CamelIrcValue
